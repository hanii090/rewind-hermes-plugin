name: rewind
version: "0.3.4"
manifest_version: 2
api_version: 1
description: "Per-step undo timeline for agent file/git changes (not memory). Every write_file/patch/terminal is a numbered step; /rewind restores files+HEAD, /rewind fork tries an alternative in a worktree, irreversible side-effects are flagged. Complements built-in /rollback + /undo — does not replace them."
author: Rehan Aslam (hanii090)
license: MIT
homepage: https://github.com/hanii090/rewind-hermes-plugin
tags: [undo, checkpoint, git, safety, timeline]
requires_hermes: ">=0.21.6"
provides_tools:
  - rewind_restore
provides_hooks: []
provides_middleware:
  - tool_execution
config_schema:
  max_file_bytes: {type: int, default: 5000000, label: "Max file size to snapshot (bytes)"}
  max_files: {type: int, default: 5000, label: "Max files per non-git snapshot"}
  ignore_globs: {type: list, default: ["node_modules/*", ".venv/*", "__pycache__/*", "*.pyc", ".git/*", "dist/*", "build/*"], label: "Ignore globs"}
  snapshot_terminal: {type: bool, default: true, label: "Snapshot before terminal/execute_code calls"}
  retention_days: {type: int, default: 14, label: "Drop timeline steps older than N days"}
  max_store_mb: {type: int, default: 500, label: "Cap on non-git snapshot storage (MB)"}
  max_steps_per_session: {type: int, default: 2000, label: "Keep at most N steps per session"}
  restore_mode: {type: string, default: move_head, label: "Git restore: move_head (reset branch tip) or worktree_only (files only)"}
